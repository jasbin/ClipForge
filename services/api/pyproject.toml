[project]
name = "clipforge"
version = "0.1.0"
description = "Viral clip finder & clipper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
    "ollama>=0.5",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Cross-platform transcription fallback (non-Apple-Silicon machines).
cpu = ["faster-whisper>=1.1"]
# URL ingest. Only for content you own or have the rights to.
url = ["yt-dlp[default]>=2024.8"]
# AI voiceover (Qwen3-TTS). torch 2.6 garbles audio on Metal; verified good on torch 2.14.
tts = ["qwen-tts==0.1.1", "torch>=2.14", "torchaudio>=2.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipforge*"]
